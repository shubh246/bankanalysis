services:
  - type: web
    name: bank-statement-backend
    env: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bank-statement-db
          property: connectionString

  - type: web
    name: bank-statement-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: bank-statement-backend
          property: host

databases:
  - name: bank-statement-db
    region: singapore
    plan: free


